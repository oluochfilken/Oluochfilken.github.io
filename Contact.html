<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Oluoch Filken</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Oluoch Filken</h1>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Me</h2>
            <p>
                Do you have a question or want to work
                together? Send me a message.
            </p>

            <form id="contactForm">

                <fieldset>
                    <legend>Your Contact Information</legend>

                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" required>

                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="6" required></textarea>

                    <button type="submit">Send Message</button>
                </fieldset>

            </form>

            <p id="formMessage" role="status" aria-live="polite"></p>
        </section>

        <section>
            <h2>Find Me Online</h2>
            <p>
                GitHub:
                <a href="https://github.com/oluochfilken"
                   target="_blank" rel="noopener noreferrer">
                    My GitHub Profile
                </a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Oluoch Filken. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
  </html>
